#!/usr/bin/env python
PACKAGE = "agribot_navigation"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("front_kp",    double_t,    0, "front cart Kp",    0.67, 0, 10)
gen.add("front_ki",    double_t,    0, "front cart Ki",    0.03, 0, 10)
gen.add("front_kd",    double_t,    0, "front cart Kd",    2.39, 0, 10)
gen.add("back_kp",    double_t,    0, "back cart Kp",  0.67, 0, 10)
gen.add("back_ki",    double_t,    0, "back cart Ki",  0.03, 0, 10)
gen.add("back_kd",    double_t,    0, "back cart Kd",  2.39, 0, 10)
gen.add("front_limit",    double_t,    0, "front PID antiwindup limit in degrees per second", 40.0,  0, 90)
gen.add("back_limit",    double_t,    0, "back PID antiwindup limit in degrees per second", 40.0,  0, 90)

exit(gen.generate(PACKAGE, "agribot_navigation", "Kinematics"))