#!/usr/bin/env python
PACKAGE = "agribot_navigation"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("front_kp",    double_t,    0, "front cart Kp",    0.3, 0, 10)
gen.add("front_ki",    double_t,    0, "front cart Ki",    4.0, 0, 10)
gen.add("front_kd",    double_t,    0, "front cart Kd",    0.4, 0, 10)
gen.add("back_kp",    double_t,    0, "back cart Kp",  0.3, 0, 10)
gen.add("back_ki",    double_t,    0, "back cart Ki",  4.0, 0, 10)
gen.add("back_kd",    double_t,    0, "back cart Kd",  0.4, 0, 10)
gen.add("precision_range",    double_t,    0, "precision range in degrees", 7.2,  0, 360)
gen.add("front_limit",    double_t,    0, "front PID antiwindup limit in degrees per second", 20.7,  0, 90)
gen.add("back_limit",    double_t,    0, "back PID antiwindup limit in degrees per second", 20.7,  0, 90)

exit(gen.generate(PACKAGE, "agribot_navigation", "Kinematics"))