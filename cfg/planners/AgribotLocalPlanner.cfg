#!/usr/bin/env python
PACKAGE = "agribot_navigation"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("max_linear_vel",    double_t,    0, "Max linear velocity",    0.4, 0.0, 3.0)
gen.add("pure_pursuit_rabbit_distance",    double_t,    0, "Pure Pursuit controller rabbit distance",    6.0, 0.0, 10.0)
gen.add("stanley_error_gain",    double_t,    0, "Stanley controller error gain",    0.7, 0, 1.0)
gen.add("min_planning_distance_in_row",    double_t,    0, "Minimal planning distance in row mode",    3.0, 0.1, 10.0)
gen.add("use_robot_front_pose",   bool_t,   0, "Use robot front pose for planning, otherwise use center of the robot",  True)

exit(gen.generate(PACKAGE, "agribot_navigation", "AgribotLocalPlanner"))