WaypointGlobalPlanner:
  epsilon: 1e-1  # distance threshold for final waypoint
  waypoints_per_meter: 0.5  # number of waypoints per meter for the interpolation of the path
  goal_distance_tolerance: 0.75

NavfnROS:
  allow_unknow: true
  use_dijkstra: true
  use_quadratic: true
  use_grid_path: false
  old_navfn_behavior: false
  visualize_potensial: false
  cost_factor: 0.55
  neutral_cost: 66
  lethal_cost: 253
