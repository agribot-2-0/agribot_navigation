SimplePlannerROS:
  chassis_length: 2.1
  max_linear_vel: 0.7
  min_linear_vel: 0.1
  min_radius: 2.1
  dead_zone: 3.0
  deviation_weight_straight: 0.6
  parallelness_weight_straight: 10.0
  deviation_weight_arch: 0.6
  parallelness_weight_arch: 10.0
  goal_distance_tolerance: 0.25 # RADIUS
  goal_range: 0.66 # COEFFICIENT
  missed_points_tollerance: 10000
  prediction_time: 60
  prediction_points_per_second: 2
  epsilon: 1e-3
  arch_approach: false
  speed_limit: true
  debug: false
  statistics: true
  take_front: false

AgribotPlannerROS:
  chassis_length: 2.1
  max_linear_vel: 0.7
  min_linear_vel: 0.1
  min_radius: 2.1
  dead_zone: 3.0
  deviation_weight_straight: 0.6
  parallelness_weight_straight: 10.0
  deviation_weight_arch: 5.0
  parallelness_weight_arch: 10.3
  goal_distance_tolerance: 0.25 # RADIUS COEFFICIENT
  goal_range: 0.3 # metres
  missed_points_tollerance: 10000
  prediction_time: 60
  prediction_points_per_second: 2
  epsilon: 1e-3
  design_dead_zone: 0.0 # degrees
  design_arch_radius: 2.5 # metres
  design_arch_step: 5.0 # degrees

  arch_approach: false
  speed_limit: true
  debug: false
  statistics: true
  take_front: false


TrajectoryPlannerROS:

# Robot Configuration Parameters
  max_vel_x: 0.25
  min_vel_x: -0.25
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_theta: 0.238
  min_vel_theta: -0.238
  min_in_place_vel_theta: 2.0

  acc_lim_x: 2.0
  acc_lim_y: 0.0
  acc_lim_theta: 1.0

# Goal Tolerance Parameters
  xy_goal_tolerance: 0.5
  yaw_goal_tolerance: 3.14

# Differential-drive robot configuration
  holonomic_robot: false

# Forward Simulation Parameters
  sim_time: 1.0
  vx_samples: 18
  vtheta_samples: 20
  sim_granularity: 0.05

  meter_scoring: true


